button:disabled{opacity:.55;cursor:not-allowed}
#msg{margin-top:14px;font-size:12.5px;min-height:18px}
#msg.err{color:#f85149}
#msg.ok{color:#3fb950}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #30363d;

@keyframes spin{to{transform:rotate(360deg)}}
</style>

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function sha256(buf) {
  return new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
}
function hex(u8){ return [...u8].map(b => b.toString(16).padStart(2,'0')).join(''); }

async function deriveKey(pw, salt, iter) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt, iterations: iter, hash:'SHA-256' }, base, 512);
  return new Uint8Array(bits);
}

async function unlock() {
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('go');
  if (!pw) { msg.className='err'; msg.textContent='请输入密码'; return; }
  btn.disabled = true;
  msg.className = ''; msg.innerHTML = '<span class="spinner"></span>正在解密…';
  try {
    const salt = b64d(DATA.salt);
    const nonce = b64d(DATA.nonce);
    const ct = b64d(DATA.ct);
    const key = await deriveKey(pw, salt, DATA.iter);
    const encKey = key.slice(0,32), macKey = key.slice(32);

    // 生成密钥流
    const len = ct.length;
    const ks = new Uint8Array(len);
    let off = 0, counter = 0;
    const ctr = new Uint8Array(8);
    while (off < len) {
      const dv = new DataView(ctr.buffer);
      dv.setBigUint64(0, BigInt(counter), false);
      const block = new Uint8Array([...macKey, ...nonce, ...ctr]);
      const h = await sha256(block);
      const take = Math.min(32, len - off);
      ks.set(h.subarray(0, take), off);
      off += take; counter++;
    }

    // 解密
    const pt = new Uint8Array(len);
    for (let i = 0; i < len; i++) pt[i] = ct[i] ^ ks[i];

    // 校验 tag
    const tagInput = new Uint8Array([...macKey, ...nonce, ...ct]);
    const expectTag = hex(await sha256(tagInput));
    if (expectTag !== DATA.tag) {
      msg.className='err'; msg.textContent='密码错误'; btn.disabled=false; return;
    }

    const html = new TextDecoder('utf-8').decode(pt);
    msg.className='ok'; msg.textContent='解密成功，正在加载…';
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    msg.className='err';
    msg.textContent = '解密失败：' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});
</script>
