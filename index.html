<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

#box{width:min(460px,92vw);background:#131820;border:1px solid #222c3a;border-radius:14px;

#drop .sub{font-size:11px;color:#4d5561;margin-top:6px}
#fname{margin-top:12px;font-size:12.5px;color:#58a6ff;min-height:18px;word-break:break-all}
#msg{margin-top:16px;font-size:13px;min-height:20px;line-height:1.5}
#msg.err{color:#f85149}
#msg.ok{color:#3fb950}
#msg.busy{color:#8b949e}
.sp{display:inline-block;width:12px;height:12px;border:2px solid #2a3543;
border-top-color:#3b82f6;border-radius:50%;animation:sp .7s linear infinite;
vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
#foot{margin-top:20px;padding-top:14px;border-top:1px solid #1c242f;
font-size:11px;color:#3d4551;text-align:center}
</style>

const $ = id => document.getElementById(id);
const b64d = s => { const b = atob(s); const u = new Uint8Array(b.length);
  for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const hex = u8 => { let s=''; for (let i=0;i<u8.length;i++) s += u8[i].toString(16).padStart(2,'0'); return s; };
const sha256 = async b => new Uint8Array(await crypto.subtle.digest('SHA-256', b));

async function derive(material, salt, iter){
  const base = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, 512);
  return new Uint8Array(bits);
}

const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files.length) handle(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handle(fileInput.files[0]);
});

function fail(msg, text){
  msg.className = 'err';
  msg.textContent = text || '凭证无效。';
}

async function handle(file){
  const msg = $('msg');
  $('fname').textContent = '已选择：' + file.name;
  msg.className = 'busy';
  msg.innerHTML = '<span class="sp"></span>正在校验…';

  try {
    const buf = new Uint8Array(await file.arrayBuffer());

    // 结构检查：8 字节头 + 32 字节密钥 = 40 字节
    if (buf.length < 40) { await new Promise(r=>setTimeout(r,600)); return fail(msg); }
    const keyBytes = buf.slice(8, 40);
    if (keyBytes.length !== 32) { await new Promise(r=>setTimeout(r,600)); return fail(msg); }

    // 用文件内密钥 + 固定口令派生
    const pass = new TextEncoder().encode('lix12345.com');
    const material = new Uint8Array(32 + pass.length);
    material.set(keyBytes, 0);
    material.set(pass, 32);

    const salt = b64d(DATA.salt);
    const nonce = b64d(DATA.nonce);
    const ct = b64d(DATA.ct);

    const k = await derive(material, salt, DATA.iter);
    const macKey = k.slice(32);

    // 先验 tag —— 这是唯一的验证环节，页面不含任何凭证哈希
    const tagInput = new Uint8Array(32 + 16 + ct.length);
    tagInput.set(macKey, 0);
    tagInput.set(nonce, 32);
    tagInput.set(ct, 48);
    const expect = hex(await sha256(tagInput));

    if (expect !== DATA.tag) {
      // 失败也加延迟，避免时序区分
      await new Promise(r => setTimeout(r, 700 + Math.random() * 500));
      return fail(msg);
    }

    // tag 通过 → 解密
    const len = ct.length, ks = new Uint8Array(len);
    let off = 0, counter = 0;
    const ctr = new Uint8Array(8);
    const dv = new DataView(ctr.buffer);
    while (off < len) {
      dv.setBigUint64(0, BigInt(counter), false);
      const block = new Uint8Array(56);
      block.set(macKey, 0); block.set(nonce, 32); block.set(ctr, 48);
      const hh = await sha256(block);
      const take = Math.min(32, len - off);
      ks.set(hh.subarray(0, take), off);
      off += take; counter++;
    }
    const pt = new Uint8Array(len);
    for (let i = 0; i < len; i++) pt[i] = ct[i] ^ ks[i];

    msg.className = 'ok'; msg.textContent = '验证通过，正在载入…';
    const html = new TextDecoder('utf-8').decode(pt);
    setTimeout(() => { document.open(); document.write(html); document.close(); }, 400);

  } catch (e) {
    await new Promise(r => setTimeout(r, 400));
    fail(msg, '凭证无效。');
  }
}
</script>
